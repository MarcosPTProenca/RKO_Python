[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rko"
version = "0.3.0.dev0"
description = "Cooperative random-key optimization with configurable metaheuristic portfolios"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0.0",
]

[project.scripts]
rko = "rko.examples.run_kp_cpp_instances:main"

[project.urls]
Repository = "https://github.com/MarcosPTProenca/RKO_Python"
Issues = "https://github.com/MarcosPTProenca/RKO_Python/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["rko*"]
exclude = ["rko.tests*", "*__pycache__*", "rko.examples.results*"]

[tool.setuptools.package-data]
rko = ["parameters/*.toml", "examples/instances/*"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.2",
    "mutmut>=3.8.0",
    "pre-commit>=4.2.0",
    "pytest>=9.0.2",
    "ruff==0.15.7",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
no-sections = true
force-single-line = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/rko/tests"]

[tool.mutmut]
source_paths = ["src"]
only_mutate = [
    "src/rko/components/solution_pool.py",
    "src/rko/components/validation.py",
    "src/rko/components/adaptive_control/q_learning.py",
    "src/rko/components/initialization/initialization.py",
    "src/rko/components/shaking/random.py",
    "src/rko/components/shaking/mirror.py",
    "src/rko/components/shaking/neighbor_swap.py",
    "src/rko/components/shaking/swap.py",
    "src/rko/metaheuristics/grasp.py",
    "src/rko/metaheuristics/brkga_cs.py",
    "src/rko/solver.py",
    "src/rko/orchestration/factory.py",
]
mutate_only_covered_lines = true
pytest_add_cli_args_test_selection = [
    "src/rko/tests/test_property_invariants.py",
    "src/rko/tests/components/test_solution_pool_pytest.py",
    "src/rko/tests/rko/test_pool_sampling.py",
    "src/rko/tests/components/test_parameter_contracts.py",
    "src/rko/tests/components/test_q_learning_pytest.py",
    "src/rko/tests/components/test_q_state_graph.py",
    "src/rko/tests/components/test_initialization_and_operators_pytest.py",
    "src/rko/tests/metaheuristics/test_validation.py",
    "src/rko/tests/metaheuristics/test_algorithm_regressions.py",
    "src/rko/tests/metaheuristics/test_metaheuristics_pytest.py",
    "src/rko/tests/rko/test_solver.py",
    "src/rko/tests/rko/test_hyperparameters.py",
    "src/rko/tests/rko/test_stopping.py",
    "src/rko/tests/rko/test_search_metadata.py",
    "src/rko/tests/rko/test_result_metadata.py",
    "-k",
    "not test_solution_pool_implements_search_protocols",
]
