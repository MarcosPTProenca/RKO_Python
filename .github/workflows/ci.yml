name: CI

on:
  push:
    branches: [main, master, rko]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format check
        run: uv run --locked ruff format --check .
      - name: Full test suite
        run: uv run --locked pytest src/rko/tests -q
      - name: Build distribution artifacts
        run: uv build
      - name: Test isolated wheel and sdist installs
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$artifact" python -I tools/smoke_installed.py
          done
