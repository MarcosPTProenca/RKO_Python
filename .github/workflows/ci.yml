name: CI

on:
  push:
    branches: [main, master, rko]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv v10.3.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - name: Check native dependency notices without Rust
        run: uv run --locked python tools/check_native_licenses.py
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format check
        run: uv run --locked ruff format --check .
      - name: Full test suite
        run: uv run --locked pytest src/rko/tests -q
      - name: Optional interactive reports
        run: uv run --locked --extra reports pytest src/rko/tests/rko/test_reporting.py -q
      - name: Source-identified profile diagnostic smoke
        run: uv run --locked python -m benchmarks.performance_profile --dimension 4 --evaluations 8 --profile
      - name: Native-thread launch smoke
        run: uv run --locked --with threadpoolctl==3.7.0 python benchmarks/native_threads.py --repeats 1 --dimension 8 --evaluations 2 --workers 1
      - name: IPR fixed-work diagnostic smoke
        run: uv run --locked python benchmarks/ipr_diagnosis.py --evaluations 64 --seeds 1 --dimension 20
      - name: Prefill matched-work diagnostic smoke
        run: uv run --locked python benchmarks/prefill_work.py --evaluations 64 --seeds 1 --dimension 4 --capacity 3
      - name: Upload artifact contract v7.0.2
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-artifact-contract-${{ github.run_attempt }}
          path: pyproject.toml
          if-no-files-found: error
          retention-days: 1
      - name: Download artifact contract v8.0.2
        if: runner.os == 'Linux'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ci-artifact-contract-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rko-artifact-contract
          merge-multiple: true
      - name: Verify artifact round trip
        if: runner.os == 'Linux'
        shell: bash
        run: cmp pyproject.toml "$RUNNER_TEMP/rko-artifact-contract/pyproject.toml"
      - name: Build distribution artifacts
        run: uv build
      - name: Test isolated wheel and sdist installs
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$artifact" python -I tools/smoke_installed.py
          done

  optional-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"
      RKO_BUILD_NATIVE: "0"
      RKO_USE_NATIVE: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv v10.3.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Sync Python-only development environment
        run: uv sync --locked --group dev
      - name: Check native dependency notices
        run: uv run --locked --no-sync python tools/check_native_licenses.py
      - name: Validate pure and mixed installed artifacts
        run: uv run --locked --no-sync python tools/validate_native_package.py
