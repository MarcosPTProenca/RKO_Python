name: Distribution checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      tag:
        type: string
        required: true

permissions:
  contents: read

env:
  RKO_BUILD_NATIVE: "0"
  RKO_USE_NATIVE: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Set up uv v10.3.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Build publication artifacts once
        run: uv build --out-dir release/dist
      - name: Strict metadata and README check
        run: uv run --locked --only-group release twine check --strict release/dist/*
      - name: Validate source, licenses and artifact inventory
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          args=()
          if [ -n "$RELEASE_TAG" ]; then args+=(--tag "$RELEASE_TAG"); fi
          uv run --locked --only-group release python tools/release.py create --payload release "${args[@]}"
      - name: Retain immutable payload v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 30

  installed:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Set up uv v10.3.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Download same payload v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-candidate
          path: release/
      - name: Check hashes and clean core/report installs
        run: uv run --locked --only-group release python tools/release.py smoke --payload release
