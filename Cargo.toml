[workspace]
resolver = "3"
members = ["crates/rko-core", "crates/rko-py"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
